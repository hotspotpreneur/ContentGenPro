<!DOCTYPE html>
<html lang="en">

  <title>ContentGenPro - AI Content Generator</title>

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: #0a0a0a; font-family: 'DM Mono', monospace; color: #ddd; -webkit-text-size-adjust: 100%; }
    @keyframes pulse { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
    @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .fade-in { animation: slideIn 0.3s ease-out; }
    .gradient-text { background: linear-gradient(135deg, #00ff88 0%, #00d4ff 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

    .container { max-width: 960px; margin: 0 auto; padding: 16px; }
    .main-content { overflow-y: auto; }
    .main-content::-webkit-scrollbar { width: 4px; }
    .main-content::-webkit-scrollbar-track { background: #0a0a0a; }
    .main-content::-webkit-scrollbar-thumb { background: #222; }

    .section { margin-bottom: 14px; }
    .section-title { font-size: 9px; color: #00d4ff; letter-spacing: 0.15em; margin-bottom: 6px; text-transform: uppercase; border-bottom: 1px solid #1a1a1a; padding-bottom: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .count-controls { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 14px; background: #111; border: 1px solid #222; border-radius: 4px; margin-bottom: 12px; }
    .count-controls .group { display: flex; align-items: center; gap: 4px; }
    .count-controls label { font-size: 9px; color: #00d4ff; letter-spacing: 0.05em; min-width: 50px; }
    .count-controls select { background: #0a0a0a; border: 1px solid #333; color: #ddd; padding: 2px 6px; font-size: 10px; font-family: 'DM Mono', monospace; border-radius: 2px; min-width: 44px; touch-action: manipulation; }
    .count-controls .badge-count { color: #00ff88; font-size: 9px; margin-left: 4px; }
    .count-controls .fixed-badge { background: #1a2a1a; color: #00ff88; padding: 2px 8px; border-radius: 10px; font-size: 8px; border: 1px solid #00ff8844; }

    .profile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
    .profile-grid input { background: #111; border: 1px solid #222; border-left: 3px solid #ff6b35; color: #ddd; padding: 6px 10px; font-size: 16px; font-family: 'DM Mono', monospace; border-radius: 2px; outline: none; width: 100%; }
    .profile-grid input:focus { border-color: #00ff88; }
    .profile-grid input::placeholder { color: #888; font-size: 11px; }

    .keyword-input-wrap { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
    .keyword-input-wrap input { flex: 1; min-width: 150px; background: #111; border: 1px solid #222; border-left: 3px solid #ff6b35; color: #ddd; padding: 6px 10px; font-size: 16px; font-family: 'DM Mono', monospace; border-radius: 2px; outline: none; }
    .keyword-input-wrap input:focus { border-color: #00ff88; }
    .keyword-input-wrap input::placeholder { color: #888; font-size: 11px; }
    .keyword-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .keyword-tag { display: inline-flex; align-items: center; gap: 4px; background: #1a2a1a; border: 1px solid #00ff8822; color: #00ff88; padding: 2px 8px; font-size: 9px; font-family: 'DM Mono', monospace; border-radius: 12px; }
    .keyword-tag .remove { cursor: pointer; color: #888; font-size: 10px; min-width: 20px; min-height: 20px; display: inline-flex; align-items: center; justify-content: center; }
    .keyword-tag .remove:hover { color: #ff4444; }

    .backlink-input-wrap { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
    .backlink-input-wrap input { flex: 1; min-width: 200px; background: #111; border: 1px solid #222; border-left: 3px solid #ff6b35; color: #ddd; padding: 6px 10px; font-size: 16px; font-family: 'DM Mono', monospace; border-radius: 2px; outline: none; }
    .backlink-input-wrap input:focus { border-color: #ff6b35; }
    .backlink-input-wrap input::placeholder { color: #888; font-size: 11px; }
    .backlink-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .backlink-tag { display: inline-flex; align-items: center; gap: 6px; background: #1a1a2a; border: 1px solid #ff6b3544; color: #ff6b35; padding: 2px 8px; font-size: 9px; font-family: 'DM Mono', monospace; border-radius: 12px; }
    .backlink-tag .url { color: #aaa; font-size: 8px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .backlink-tag .remove { cursor: pointer; color: #888; font-size: 10px; min-width: 20px; min-height: 20px; display: inline-flex; align-items: center; justify-content: center; }
    .backlink-tag .remove:hover { color: #ff4444; }

    .ahref-box { background: #0a0a0a; border: 1px solid #ff6b3533; border-left: 3px solid #ff6b35; border-radius: 2px; padding: 8px 12px; margin-top: 8px; font-family: 'DM Mono', monospace; font-size: 11px; color: #00d4ff; word-break: break-all; white-space: pre-wrap; }
    .ahref-label { color: #ff6b35; font-size: 9px; font-family: 'DM Mono', monospace; letter-spacing: 0.12em; margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 4px; }

    .info-trigger { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: #1a2a1a; border: 1px solid #00ff8844; color: #00ff88; font-size: 9px; font-family: 'DM Mono', monospace; cursor: pointer; transition: all 0.2s; position: relative; touch-action: manipulation; }
    .info-trigger:hover { background: #00ff88; color: #0a0a0a; border-color: #00ff88; }
    .info-trigger:hover .info-popup { display: block; }
    .info-popup { display: none; position: absolute; top: calc(100% + 10px); left: 50%; transform: translateX(-50%); width: 320px; background: #111; border: 1px solid #333; border-radius: 6px; padding: 14px 16px; z-index: 100; box-shadow: 0 8px 32px rgba(0,0,0,0.8); text-align: left; animation: fadeIn 0.2s ease-out; }
    .info-popup::before { content: ''; position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 6px solid #333; }
    .info-popup .popup-title { color: #00ff88; font-size: 11px; font-weight: bold; font-family: 'DM Mono', monospace; letter-spacing: 0.05em; margin-bottom: 6px; }
    .info-popup .popup-body { color: #ccc; font-size: 11px; line-height: 1.6; font-family: 'Lora', Georgia, serif; }
    .info-popup .popup-body strong { color: #fff; }
    .info-popup .popup-body code { background: #1a1a1a; color: #00ff88; padding: 1px 6px; border-radius: 2px; font-size: 10px; font-family: 'DM Mono', monospace; }

    .save-bar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .save-bar button { background: transparent; border: 1px solid #333; color: #ddd; padding: 6px 14px; font-size: 10px; font-family: 'DM Mono', monospace; cursor: pointer; border-radius: 4px; transition: all 0.2s; touch-action: manipulation; min-height: 40px; }
    .save-bar button:hover { border-color: #00ff88; color: #00ff88; }
    .save-bar button.primary { background: #00ff88; color: #0a0a0a; border: none; }
    .save-bar button.primary:hover { opacity: 0.8; }
    .save-bar .project-name-input { background: #0a0a0a; border: 1px solid #333; color: #ddd; padding: 6px 12px; font-size: 16px; font-family: 'DM Mono', monospace; border-radius: 4px; flex: 1; min-width: 120px; min-height: 40px; }
    .save-bar .project-name-input::placeholder { color: #888; font-size: 11px; }

    textarea { width: 100%; min-height: 80px; background: #111; border: 1px solid #222; border-left: 3px solid #00ff88; color: #ddd; padding: 10px 14px; font-size: 16px; font-family: 'Lora', Georgia, serif; line-height: 1.6; resize: vertical; outline: none; box-sizing: border-box; border-radius: 2px; }
    textarea:focus { border-color: #00ff88; }
    textarea::placeholder { color: #888; font-size: 12px; }

    .input-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; flex-wrap: wrap; gap: 6px; }
    .input-footer .char-count { font-size: 9px; color: #aaa; letter-spacing: 0.1em; }
    .input-footer .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .input-footer .generate-btn { background: #00ff88; border: none; color: #0a0a0a; padding: 10px 20px; font-size: 11px; font-family: 'DM Mono', monospace; cursor: pointer; letter-spacing: 0.1em; border-radius: 4px; transition: all 0.2s; touch-action: manipulation; min-height: 44px; }
    .input-footer .generate-btn:hover:not(:disabled) { opacity: 0.8; }
    .input-footer .generate-btn:disabled { background: #222; color: #444; cursor: not-allowed; }
    .input-footer .regenerate-btn { background: #ff6b35; border: none; color: #0a0a0a; padding: 10px 20px; font-size: 11px; font-family: 'DM Mono', monospace; cursor: pointer; letter-spacing: 0.1em; border-radius: 4px; transition: all 0.2s; touch-action: manipulation; min-height: 44px; }
    .input-footer .regenerate-btn:hover:not(:disabled) { opacity: 0.8; }
    .input-footer .regenerate-btn:disabled { background: #442211; color: #886655; cursor: not-allowed; }

    .research-badge { margin-top: 4px; padding: 4px 12px; background: #0d1a0d; border: 1px solid #00ff8822; border-radius: 2px; }
    .research-badge span { color: #00ff88; font-size: 9px; font-family: 'DM Mono', monospace; }

    .tag { display: inline-block; padding: 2px 8px; margin: 2px; border-radius: 2px; font-size: 9px; background: #1a1a1a; border: 1px solid #333; color: #00ff88; }
    .script-block { margin-bottom: 16px; }
    .script-block .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 4px; }
    .script-block .header .label { color: #00ff88; font-size: 9px; font-family: 'DM Mono', monospace; letter-spacing: 0.15em; text-transform: uppercase; }
    .script-block .header .meta { display: flex; gap: 6px; align-items: center; }
    .script-block .header .meta .word-count { color: #aaa; font-size: 8px; font-family: 'DM Mono', monospace; }
    .script-block .body { background: #111; border: 1px solid #222; padding: 12px 14px; color: #ccc; font-size: 13px; line-height: 1.6; font-family: 'Lora', Georgia, serif; white-space: pre-wrap; border-left: 3px solid #00ff88; border-radius: 2px; word-break: break-word; }

    .share-wrapper { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .share-btn { display: inline-flex; align-items: center; justify-content: center; padding: 6px 10px; border: 1px solid #333; border-radius: 3px; background: transparent; color: #aaa; font-size: 9px; font-family: 'DM Mono', monospace; cursor: pointer; transition: all 0.2s; gap: 4px; text-decoration: none; touch-action: manipulation; min-height: 36px; }
    .share-btn:hover { border-color: #00ff88; color: #00ff88; background: #0d1a0d; }
    .share-btn .icon { font-size: 12px; }
    .share-dropdown { position: relative; display: inline-block; }
    .share-dropdown-content { display: none; position: absolute; top: 100%; left: 0; background: #111; border: 1px solid #333; border-radius: 4px; padding: 6px; z-index: 200; min-width: 160px; box-shadow: 0 8px 24px rgba(0,0,0,0.9); }
    .share-dropdown-content.show { display: block; }
    .share-dropdown-content .share-btn { display: flex; width: 100%; padding: 8px 12px; border: none; border-radius: 2px; min-height: 40px; }

    .tabs { display: flex; gap: 0; border-bottom: 1px solid #1a1a1a; margin-bottom: 14px; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button { background: transparent; border: none; border-bottom: 2px solid transparent; color: #aaa; padding: 8px 12px; font-size: 9px; font-family: 'DM Mono', monospace; letter-spacing: 0.1em; cursor: pointer; white-space: nowrap; transition: all 0.15s; flex-shrink: 0; touch-action: manipulation; min-height: 40px; }
    .tabs button:hover { color: #fff; }
    .tabs button.active { color: #fff; border-bottom-color: #00ff88; }

    .empty-state { color: #888; text-align: center; padding: 30px 16px; font-size: 12px; }
    .empty-state .icon { font-size: 36px; display: block; margin-bottom: 10px; }
    .loading-bar { border: 1px solid #1a1a1a; border-left: 3px solid #00ff88; padding: 12px 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; }
    .loading-bar .dots { display: flex; gap: 4px; }
    .loading-bar .dots div { width: 5px; height: 5px; background: #00ff88; border-radius: 50%; animation: pulse 1.2s ease-in-out infinite; }
    .loading-bar .dots div:nth-child(2) { animation-delay: 0.2s; }
    .loading-bar .dots div:nth-child(3) { animation-delay: 0.4s; }
    .loading-bar .text { color: #aaa; font-size: 11px; letter-spacing: 0.1em; }
    .error-bar { border-left: 3px solid #ff4444; padding: 10px 14px; color: #ff4444; font-size: 11px; margin-bottom: 12px; background: #110000; border-radius: 2px; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow-y: auto; }
    .keyword-highlight { background: #1a3a1a; color: #00ff88; padding: 0 2px; border-radius: 2px; }

    .footer-disclaimer { border-top: 1px solid #1a1a1a; padding: 20px; text-align: center; font-size: 8px; color: #aaa; font-family: 'DM Mono', monospace; letter-spacing: 0.1em; margin-top: 12px; }

    .agreement-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 16px; }
    .agreement-modal { background: #111; border: 1px solid #333; padding: 30px 40px; max-width: 600px; width: 100%; max-height: 80vh; overflow-y: auto; border-radius: 8px; box-shadow: 0 8px 64px rgba(0,0,0,0.8); }
    .agreement-modal h2 { color: #00ff88; font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 0.05em; margin-bottom: 12px; }
    .agreement-modal p { color: #ccc; font-size: 13px; line-height: 1.7; font-family: 'Lora', Georgia, serif; margin-bottom: 12px; }
    .agreement-modal .terms-box { background: #0a0a0a; border: 1px solid #222; padding: 16px; border-radius: 4px; max-height: 200px; overflow-y: auto; margin: 12px 0; font-size: 12px; color: #aaa; font-family: 'Lora', Georgia, serif; line-height: 1.6; }
    .agreement-modal .actions { display: flex; gap: 12px; justify-content: flex-end; }
    .agreement-modal .actions button { padding: 12px 24px; font-size: 11px; font-family: 'DM Mono', monospace; border: none; border-radius: 4px; cursor: pointer; letter-spacing: 0.1em; touch-action: manipulation; min-height: 44px; }
    .agreement-modal .actions .accept { background: #00ff88; color: #0a0a0a; }

    .backlink-output { background: #111; border: 1px solid #222; border-left: 3px solid #ff6b35; padding: 14px 16px; margin-bottom: 12px; border-radius: 2px; }
    .backlink-output .backlink-title { color: #ff6b35; font-size: 11px; font-family: 'DM Mono', monospace; letter-spacing: 0.1em; }
    .backlink-output .backlink-url { color: #aaa; font-size: 10px; margin-top: 2px; word-break: break-all; }
    .backlink-output .backlink-text { color: #ccc; font-size: 13px; font-family: 'Lora', Georgia, serif; line-height: 1.6; margin-top: 6px; padding: 8px 10px; background: #0a0a0a; border-radius: 2px; white-space: pre-wrap; }

    .podcast-output { background: #111; border: 1px solid #222; border-left: 3px solid #ff6b35; padding: 14px 16px; margin-bottom: 12px; border-radius: 2px; }
    .podcast-output .podcast-title { color: #ff6b35; font-size: 11px; font-family: 'DM Mono', monospace; letter-spacing: 0.1em; }
    .podcast-output .podcast-script { color: #ccc; font-size: 13px; font-family: 'Lora', Georgia, serif; line-height: 1.6; margin-top: 6px; padding: 8px 10px; background: #0a0a0a; border-radius: 2px; white-space: pre-wrap; max-height: 400px; overflow-y: auto; }
    .podcast-output .podcast-meta { color: #888; font-size: 10px; margin-top: 4px; }

    @media (max-width: 768px) {
      .container { padding: 10px; }
      .profile-grid { grid-template-columns: 1fr 1fr; }
      .count-controls { flex-direction: row; flex-wrap: wrap; gap: 4px 10px; }
      .count-controls .group { flex: 1 1 auto; min-width: 80px; }
      .count-controls label { min-width: 40px; font-size: 8px; }
      .save-bar { flex-direction: column; }
      .save-bar .project-name-input { width: 100%; }
      .input-footer { flex-direction: column; align-items: stretch; }
      .input-footer .btn-group { justify-content: center; }
      .input-footer .generate-btn, .input-footer .regenerate-btn { flex: 1; text-align: center; }
      .info-popup { width: 260px; left: 0; transform: none; }
      .info-popup::before { left: 20px; transform: none; }
      .agreement-modal { padding: 20px; }
      .backlink-input-wrap { flex-direction: column; }
      .keyword-input-wrap { flex-direction: column; }
      .tabs button { padding: 6px 8px; font-size: 8px; }
      .footer-disclaimer { font-size: 7px; padding: 8px 12px; }
      .share-wrapper { gap: 4px; }
      .share-btn { padding: 5px 6px; font-size: 8px; }
      .share-dropdown-content { min-width: 120px; position: fixed; left: 50%; transform: translateX(-50%); top: auto; bottom: 60px; }
    }
    @media (max-width: 480px) {
      .container { padding: 6px; }
      .profile-grid { grid-template-columns: 1fr; }
      .count-controls { flex-direction: column; gap: 3px; padding: 8px; }
      .count-controls .group { flex: 1 1 auto; min-width: unset; }
      .save-bar button { padding: 8px 10px; font-size: 9px; }
      .info-popup { width: 220px; }
      .backlink-tag .url { max-width: 80px; }
      .script-block .body { font-size: 12px; padding: 10px; }
      .tabs button { padding: 6px 5px; font-size: 7px; }
      .ahref-box { font-size: 10px; }
    }
    button, select, input[type="checkbox"] { touch-action: manipulation; }
    button { min-height: 40px; }
    select { font-size: 16px; }
    @media (max-width: 768px) {
      button { min-height: 44px; }
      .save-bar button { min-height: 44px; }
    }
  </style>
</head>
